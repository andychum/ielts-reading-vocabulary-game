<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101726"><title>Python Quest · Zero to AI Engineer</title><style>
:root{color-scheme:dark;--bg:#0a1020;--panel:#141e31;--panel2:#1b2940;--line:#30405b;--txt:#eaf3ff;--muted:#aab9ce;--accent:#6ddbc0;--gold:#f7c66d;--red:#ff8c9c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#253a5d 0%,transparent 40%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--txt);line-height:1.5}button,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1280px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 16px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}.logo{font-size:1.35rem;font-weight:900;letter-spacing:-.04em;display:flex;gap:10px;align-items:center}.small{font-size:.82rem;color:var(--muted)}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:30px;padding:4px 10px;color:var(--muted);font-size:.76rem;letter-spacing:.025em}.logo-emoji{background:#243b56;border-radius:14px;padding:10px}.sideitem{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:11px 12px;margin:4px 0;border-radius:12px;background:transparent;color:var(--muted)}.sideitem:hover,.sideitem.active{background:#25364f;color:white}.sideitem.active{box-shadow:inset 3px 0 var(--accent)}.sideitem .number{font-size:.72rem;font-weight:800;background:#24364e;border-radius:7px;padding:5px}.sideitem .tick{margin-left:auto;color:var(--accent)}main{padding:32px clamp(18px,4vw,52px) 70px;min-width:0}.hero{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.hero h1{font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:-.045em;line-height:1.13;margin:8px 0}.hero p{margin:0;color:var(--muted)}.card{background:linear-gradient(160deg,#1a273e,#121d30);border:1px solid var(--line);border-radius:20px;padding:25px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.stat strong{font-size:1.5rem;display:block}.stat .small{font-size:.76rem}.worldgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.worldcard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:18px;background:#162238;cursor:pointer;text-align:left;color:var(--txt);transition:transform .15s,border-color .15s}.worldcard:hover{transform:translateY(-2px);border-color:#617c9b}.worldcard h3{margin:10px 0 3px}.worldcard p{color:var(--muted);font-size:.85rem;margin:0 0 13px}.worldcard .worldicon{font-size:2rem}.progress{height:7px;background:#30425d;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .2s}.btn{padding:10px 15px;border-radius:11px;font-weight:700;background:#2b3e59;color:white;border:1px solid #425675;display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn.primary{background:var(--accent);color:#092220;border-color:transparent}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.mode-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 22px}.mode-tabs button{border:1px solid var(--line);background:#1c2b42;color:var(--muted);border-radius:10px;padding:9px 14px}.mode-tabs button.active{background:#31586b;color:white;border-color:#6096a7}.lesson-stack{display:grid;gap:12px}.lesson-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.lesson-body p{color:var(--muted);margin:10px 0 13px}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:#090f1c;border:1px solid #30405a;border-radius:13px;padding:16px;overflow:auto;color:#c2f1e0;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}.note{padding:12px 15px;border-left:3px solid var(--accent);background:#183241;border-radius:0 10px 10px 0;color:#c9e9e3;font-size:.9rem}.qbox{border:1px solid var(--line);padding:19px;border-radius:16px;background:#162238;margin-bottom:14px}.qbox h3{margin:7px 0 13px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:1px solid #40516a;padding:12px 14px;background:#1b2a42;border-radius:10px;color:var(--txt);text-align:left;min-height:50px}.choice:hover:not(:disabled){border-color:var(--accent)}.choice.chosen{border-color:#8ab4ff;background:#304563}.choice.right{border-color:var(--accent);background:#19473e}.choice.wrong{border-color:var(--red);background:#512d3a}.choice:disabled{cursor:default}.feedback{padding:13px;margin-top:12px;border-radius:10px;background:#23344d;color:#e9f2ff}.feedback.good{background:#174138}.feedback.bad{background:#4a2a3c}.badge{border-radius:7px;padding:4px 9px;font-size:.75rem;font-weight:700;background:#314057;color:#d6e4f1}.editor{width:100%;min-height:200px;resize:vertical;background:#080f1c;color:#bff2df;border:1px solid #455672;border-radius:13px;padding:15px;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;outline:none}.editor:focus{border-color:var(--accent)}.output{min-height:75px;background:#080e19;color:#e5f4fb;border:1px solid #344862;border-radius:12px;padding:14px;white-space:pre-wrap;font:13px/1.55 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:#234c43;border:1px solid #61c6ab;color:white;padding:12px 17px;border-radius:12px;box-shadow:0 12px 35px #0008;z-index:100}.screenreader{position:absolute;left:-9999px}.mobile-header{display:none}.warning{background:#332a2a;border:1px solid #71524d;padding:10px 14px;border-radius:11px;font-size:.83rem;color:#ecd2c1;margin:12px 0}.checkpoint{font-size:.85rem;color:var(--muted);padding:8px 0}.heroaccent{font-size:3rem}.kbd{display:inline-block;padding:2px 6px;border-radius:5px;border:1px solid #55657a;background:#1c2b42;font-family:monospace}.sectionTitle{font-size:1.12rem;margin:25px 0 14px}.intro{font-size:1rem;color:var(--muted)}@media(max-width:920px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.show{display:block;position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.mobile-header{display:flex;align-items:center;justify-content:space-between;padding:12px 17px;border-bottom:1px solid var(--line)}main{padding:22px 17px 60px}.hero{margin-top:8px}}@media(max-width:650px){.stats,.worldgrid,.split{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.card{padding:17px}.worldcard{padding:15px}.stat{padding:12px}.split{grid-template-columns:1fr}.heroaccent{display:none}}@media(max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.worldgrid{grid-template-columns:1fr}}
</style></head><body>
<div class="mobile-header"><strong>🐍 Python Quest</strong><button class="btn" id="menubtn">☰ Worlds</button></div>
<div class="app"><aside class="sidebar" id="sidebar"><div class="logo"><span class="logo-emoji">🐍</span><span>Python Quest</span></div><p class="small">ZERO TO AI ENGINEER</p><div class="tag">Prepared by Andy Chum</div><p class="small" style="margin-top:25px">YOUR ADVENTURE</p><button class="sideitem" data-home="1">🏠 &nbsp; Dashboard</button><div id="worldnav"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="sideitem" data-review="1">🎯 &nbsp; Review mistakes</button><button class="sideitem" data-reset="1">↺ &nbsp; Reset progress</button></aside>
<main id="main" aria-live="polite"></main></div><script>const WORLDS = [
{title:'How Python Thinks',subtitle:'Syntax, variables and execution order',icon:'🧠',colour:'#58c5ff',lessons:[
['Instructions run in order','Python reads statements from top to bottom unless a condition, loop or function changes the flow. Think of a recipe: complete one instruction, then follow the next.','score = 2\nscore = score + 3\nprint(score)','The result is 5. The second assignment updates score.'],
['Names are labelled boxes','A variable is a name referring to a value. The equals sign assigns a value; it does not mean “is equal to” as in school maths.','city = "Fukuoka"\nvisits = 2\nprint(city, visits)','Names are case-sensitive: city and City are different.'],
['Types tell you what a value is','Integers are whole numbers, floats hold decimal numbers, strings hold text and booleans represent True or False.','age = 12\nprice = 4.5\nname = "Andy"\nready = True\nprint(type(price).__name__)','The type of price is float. Quotation marks make text a string.'],
['Errors give you clues','A SyntaxError means Python cannot read the instruction. A NameError means a name is unknown. A TypeError means an operation used incompatible types.','price = 10\nprint("£" + str(price))','Convert numbers to strings before joining them to text.'] ],
quiz:[
['What does this print?','x = 3\nx = x + 4\nprint(x)',['3','4','7','x + 4'],2,'The second statement replaces x with 7.'],
['Which is a Python string?','',['42','"42"','42.0','True'],1,'Quotes identify a string, even if its contents look numeric.'],
['What is the result of 10 // 3?','',['3','3.333','1','0'],0,'// performs floor division; for positive numbers it discards the fractional part.'],
['Which line assigns 8 to total?','',['total == 8','total = 8','8 = total','total := 8'],1,'A single = is the ordinary assignment statement.'],
['What does this print?','print(2 ** 3)',['6','8','9','5'],1,'** means exponentiation: 2 cubed is 8.'],
['Which statement about score and Score is true?','score = 5',['They are the same name','They must contain strings','They are different names','They both refer to five automatically'],2,'Python treats uppercase and lowercase letters as different.'],
['What does bool mean?','',['A decimal number','A text value','A true-or-false value','A collection'],2,'Boolean values are True and False.'],
['What error occurs?','print(missing_name)',['NameError','IndexError','ZeroDivisionError','KeyError'],0,'The variable missing_name has not been defined.'] ],
bugs:[
['Missing conversion','age = 39\nprint("Age: " + age)','TypeError','print("Age: " + str(age))','Strings cannot be joined directly to integers using +.'],
['Capital mismatch','total = 10\nprint(Total)','NameError','total = 10\nprint(total)','Variable names are case-sensitive.'] ],
labs:[
['Update a variable','Set points to 7, add 5, and print the result.','points = 7\n# Add five to points\n# Print points','12'],
['Create a message','Use a variable named language with the value "Python" and print "I study Python".','language = "Python"\n# Print: I study Python','I study Python'] ]},
{title:'Decisions and Logic',subtitle:'Conditions, comparisons and truth',icon:'🔀',colour:'#a69aff',lessons:[
['Conditions choose a path','An if statement runs its indented block only when its condition is True. elif adds another possibility; else catches the remaining cases.','score = 76\nif score >= 60:\n    print("Pass")\nelse:\n    print("Try again")','Indentation tells Python which statements belong to the branch.'],
['Compare rather than assign','Use == to compare equality, != for inequality, > and < for comparisons. = assigns; == asks a question.','temperature = 20\nprint(temperature == 20)','The result is True; we are testing rather than changing temperature.'],
['Combine conditions','and needs both conditions True. or needs at least one. not reverses a Boolean value.','age = 19\nhas_ticket = True\nprint(age >= 18 and has_ticket)','The expression evaluates to True.'],
['Empty things are usually false','An empty string, empty list, zero and None are falsey; non-empty strings and many other values are truthy.','names = []\nif not names:\n    print("No names yet")','The empty list behaves like False in this condition.'] ],
quiz:[
['What prints?','x = 4\nif x > 5:\n    print("A")\nelse:\n    print("B")',['A','B','AB','Nothing'],1,'4 is not greater than 5, so else runs.'],
['Which operator checks equality?','',['=','==','!=','>='],1,'== compares two values without assigning.'],
['What is True and False?','',['True','False','None','Error'],1,'and requires both sides to be True.'],
['What does not True evaluate to?','',['True','False','0','None'],1,'not flips a Boolean.'],
['Which expression is True?','',['3 > 7','2 == "2"','4 != 5','0 > 1'],2,'4 and 5 are different values.'],
['What does this print?','n = 0\nif n:\n    print("Yes")\nelse:\n    print("No")',['Yes','No','0','Error'],1,'The integer zero is falsey.'],
['When does an elif block run?','',['Always before if','Only when its prior conditions are false and its own is true','Only after else','Every loop'],1,'elif checks another condition after earlier branches have failed.'],
['What is True or False?','',['False','True','None','Error'],1,'or requires at least one True input.'] ],
bugs:[
['Assignment in condition','score = 60\nif score = 60:\n    print("Pass")','SyntaxError','score = 60\nif score == 60:\n    print("Pass")','A condition compares with ==, not =.'],
['Missing indentation','age = 20\nif age >= 18:\nprint("Adult")','IndentationError','age = 20\nif age >= 18:\n    print("Adult")','An if body must be indented.'] ],
labs:[
['Pass or retry','Print "Pass" when mark is 50 or more; otherwise print "Retry".','mark = 72\n# Write an if / else statement','Pass'],
['Ticket check','Print "Welcome" only if age >= 18 and ticket is True.','age = 21\nticket = True\n# Add the condition','Welcome'] ]},
{title:'Loops and Collections',subtitle:'Lists, dictionaries and repetition',icon:'🔁',colour:'#ffb66a',lessons:[
['Lists keep ordered values','A list stores multiple values. Python indexes from 0, so the first item is at position 0. Negative indexes count from the end.','colours = ["red", "blue", "green"]\nprint(colours[0])\nprint(colours[-1])','This prints red then green on separate lines.'],
['A for loop repeats work','A for loop takes one item at a time from an iterable, such as a list or a range.','for number in range(3):\n    print(number)','range(3) produces 0, 1 and 2, not 1, 2 and 3.'],
['Dictionaries pair keys and values','A dictionary is like a labelled filing cabinet: retrieve a value using its key.','student = {"name": "Mia", "score": 88}\nprint(student["score"])','It prints 88. Looking up a missing key with [] raises KeyError.'],
['Choose the right collection','Tuples cannot be changed in place. Sets hold unique elements. Lists preserve order and can be changed.','items = ["a", "b"]\nitems.append("c")\nprint(len(items))','append adds one item; len now returns 3.'] ],
quiz:[
['What prints?','names = ["A", "B", "C"]\nprint(names[1])',['A','B','C','IndexError'],1,'Index 1 is the second item.'],
['What does range(4) produce?','',['1,2,3,4','0,1,2,3','0,1,2,3,4','4 only'],1,'The stop value is excluded.'],
['What prints?','d = {"a": 2, "b": 5}\nprint(d["b"])',['a','b','2','5'],3,'The key b maps to the value 5.'],
['What is len([5, 6, 7])?','',['2','3','7','18'],1,'len returns the number of elements.'],
['Which method adds one item to the end of a list?','',['append','pop','sort','clear'],0,'append adds an element to the end.'],
['What does this print?','for i in range(2):\n    print(i)',['1 then 2','0 then 1','0 then 2','2'],1,'range(2) produces 0 and 1.'],
['Which collection removes duplicate elements?','',['list','tuple','set','dict values'],2,'A set holds unique elements.'],
['What is [10, 20, 30][-1]?','',['10','20','30','Error'],2,'-1 accesses the final element.'] ],
bugs:[
['Index out of range','scores = [10, 20, 30]\nprint(scores[3])','IndexError','scores = [10, 20, 30]\nprint(scores[2])','The final index for a three-item list is 2.'],
['Wrong dictionary key','student = {"name": "Mia"}\nprint(student["age"])','KeyError','student = {"name": "Mia"}\nprint(student.get("age", "unknown"))','get allows a default for a missing key.'] ],
labs:[
['Sum a list','Print the sum of these values using sum().','values = [4, 6, 8]\n# Print their sum','18'],
['Read a dictionary','Print the value associated with the key "language".','profile = {"name": "Andy", "language": "Cantonese"}\n# Print the language','Cantonese'] ]},
{title:'Functions and Structure',subtitle:'Reusable code, returns and imports',icon:'🧩',colour:'#70d8a5',lessons:[
['Functions are reusable recipes','Use def to name a block of instructions. Calling the function runs that block.','def greet(name):\n    return "Hello, " + name\n\nprint(greet("Mia"))','A parameter is an input name; return sends the result back to the caller.'],
['Return is not print','print displays a value. return gives a value back to the calling code, so it can be reused later.','def double(x):\n    return x * 2\nresult = double(4)\nprint(result + 1)','This prints 9. The returned value can be used in a calculation.'],
['Scope controls names','Names created inside a function are normally local to that function. A name outside it is not automatically available as a local result.','def make_number():\n    x = 5\n    return x\nprint(make_number())','Returning a value is a clear way to pass information out of a function.'],
['Imports reuse other code','Python modules package useful code. You can import standard-library functions instead of writing everything yourself.','import math\nprint(math.sqrt(16))','math.sqrt returns 4.0, a float.'] ],
quiz:[
['What prints?','def add(a, b):\n    return a + b\nprint(add(2, 3))',['2','3','5','None'],2,'The returned sum is 5.'],
['Which keyword defines a function?','',['func','define','def','function'],2,'Python function definitions start with def.'],
['What does a function return by default when it has no return statement?','',['0','False','None','An empty string'],2,'A Python function without an explicit return returns None.'],
['What prints?','def f(x):\n    print(x * 2)\ny = f(3)\nprint(y)',['6 then None','6 then 6','3 then 6','None only'],0,'f displays 6 but does not return it, so y is None.'],
['What is a parameter?','',['The value a function prints','A name that receives an argument','An error message','A Python file'],1,'Parameters are names specified in a function definition.'],
['How do you use sqrt from the math module after import math?','',['math.sqrt(9)','sqrt.math(9)','math->sqrt(9)','import.sqrt(9)'],0,'The dot accesses a member of the imported module.'],
['What does return do?','',['Always prints a message','Leaves the function and passes a value back','Repeats a loop','Imports a module'],1,'return finishes the function call with a result.'],
['What prints?','def power(x=2):\n    return x ** 2\nprint(power())',['2','4','0','Error'],1,'The default argument 2 is used when no argument is supplied.'] ],
bugs:[
['Missing return','def multiply(a, b):\n    a * b\nprint(multiply(3, 4))','Output is None','def multiply(a, b):\n    return a * b\nprint(multiply(3, 4))','Without return, the calculation is thrown away.'],
['Missing argument','def greet(name):\n    print("Hello", name)\ngreet()','TypeError','def greet(name):\n    print("Hello", name)\ngreet("Mia")','The required name parameter needs an argument.'] ],
labs:[
['Create an add function','Define add(a, b) that returns their sum, then print add(5, 7).','# Define add here\n\n# Call add(5, 7)','12'],
['Define a greeting','Define greeting(name) that returns "Hi " plus the name. Print greeting("Sam").','# Define greeting here\n\n# Print greeting("Sam")','Hi Sam'] ]},
{title:'Debug Detective',subtitle:'Tracebacks, exceptions and tests',icon:'🐛',colour:'#ff778d',lessons:[
['The traceback is a map','When code fails, a traceback usually identifies the exception type and the line where Python noticed the problem. Read from the bottom for the error type.','numbers = [1, 2]\n# numbers[2] would raise IndexError\nprint(numbers[1])','First reproduce the problem, then make the smallest sensible fix.'],
['Catch expected errors','try/except helps handle errors you expect, such as invalid user input. Avoid catching every error without understanding it.','try:\n    number = int("abc")\nexcept ValueError:\n    print("Enter a number")','Catch the specific ValueError rather than masking unrelated bugs.'],
['Test small behaviours','A test checks that actual behaviour matches expected behaviour. assert is a simple built-in way to express an expected result.','def triple(n):\n    return n * 3\nassert triple(4) == 12\nprint("Test passed")','A failing assertion raises AssertionError.'],
['Use evidence, not guesswork','Check input types, intermediate values, function outputs and edge cases. Change one cause at a time and rerun tests.','def first(items):\n    return items[0] if items else None\nprint(first([]))','An empty list is an edge case; handling it prevents IndexError.'] ],
quiz:[
['Which exception is raised by 1 / 0?','',['ValueError','ZeroDivisionError','NameError','TypeError'],1,'Division by zero raises ZeroDivisionError.'],
['Which exception is raised by int("hello")?','',['ValueError','KeyError','IndexError','ImportError'],0,'The string is not a valid integer literal.'],
['What does assert 2 + 2 == 4 do?','',['Raises an error','Passes silently','Prints 4','Returns 4'],1,'The assertion passes and produces no output.'],
['What does except ValueError: catch?','',['Every Python error','Only a ValueError and subclasses','Only syntax mistakes','Only missing keys'],1,'Specific exception handling avoids hiding unrelated failures.'],
['Which bug often happens at the end of a range?','',['Off-by-one error','Network timeout','Memory leak','Indentation style'],0,'The stop value of range is excluded, causing boundary mistakes.'],
['What should you inspect first in a traceback?','',['The colour of the text','The exception type and relevant line','The file size','The operating system theme'],1,'The exception and its location give the most useful starting point.'],
['What does this output?','try:\n    print(int("8"))\nexcept ValueError:\n    print("Bad")',['Bad','8','None','Error'],1,'Converting the string 8 succeeds, so except is skipped.'],
['What is the best first step after AI code fails?','',['Delete every test','Reproduce the failure and inspect the traceback','Rewrite the entire project','Assume the AI was right'],1,'Reproducing the error gives you evidence for a targeted fix.'] ],
bugs:[
['Bad number conversion','price = "twelve"\nprint(int(price))','ValueError','price = "12"\nprint(int(price))','int can convert a numeric string, not an arbitrary word.'],
['Unhandled empty list','items = []\nprint(items[0])','IndexError','items = []\nprint(items[0] if items else "empty")','Check whether a list has items before indexing.'] ],
labs:[
['Add an assertion','Create a function square(x) returning x*x; assert square(4)==16 and print "Passed".','# Define square\n# Add an assertion\n# Print Passed','Passed'],
['Handle bad input','Use try/except ValueError so int("oops") prints "Invalid" instead of crashing.','# Put int("oops") in a try block\n# Catch ValueError','Invalid'] ]},
{title:'Files, APIs and JSON',subtitle:'Data exchange and responsible credentials',icon:'🌐',colour:'#57d5c8',lessons:[
['JSON is a common data format','APIs often exchange JSON: objects with named keys and arrays of values. Python uses json.loads for JSON text and json.dumps to produce JSON text.','import json\nraw = \'{"level": 3}\'\ndata = json.loads(raw)\nprint(data["level"])','JSON true/false/null become Python True/False/None when decoded.'],
['Files live outside your variables','Use with open(...) to safely read/write files. The with block closes the file when finished.','from io import StringIO\nfile = StringIO("Hello")\nprint(file.read())','StringIO simulates a text file for practice without changing real files.'],
['APIs work through requests','A client sends an HTTP request to an endpoint. The server responds with a status code and usually data; 200 typically means success.','response = {"status": 200, "data": {"ok": True}}\nprint(response["data"]["ok"])','HTTP failures need handling, and not all responses contain valid JSON.'],
['Secrets do not belong in code','Keep API keys out of public GitHub repositories. Use environment variables or a secret manager on the server and never expose a private server key in browser code.','import os\nkey = os.environ.get("DEMO_API_KEY")\nprint(key is None)','Use a placeholder during learning; do not paste real keys into the game.'] ],
quiz:[
['Which function turns a JSON string into Python data?','',['json.loads','json.dumps','json.read','json.parse'],0,'loads decodes a string of JSON into Python objects.'],
['What does status code 404 usually mean?','',['Success','Not found','Server restarted','Authorised'],1,'404 indicates the requested resource could not be found.'],
['Which statement best protects a private API key?','',['Put it in public JavaScript','Commit it to GitHub','Store it in a server-side secret store','Include it in the URL'],2,'Server-side secret storage protects credentials from public source exposure.'],
['What prints?','import json\nx = json.loads(\'{"a": 2}\')\nprint(x["a"])',['a','2','None','Error'],1,'The JSON object becomes a dictionary with a mapped to 2.'],
['What is an HTTP POST commonly used for?','',['Submitting data to a server','Formatting a string','Importing Python','Indexing a list'],0,'POST commonly submits data or requests server-side processing.'],
['What does with open(...) help with?','',['Automatic file closing','Automatic encryption','Faster networks','Making variables global'],0,'A context manager closes the opened file when its block exits.'],
['Which is valid JSON text?','',['{name: "Mia"}','{"name": "Mia"}',"{'name': 'Mia'}",'{"name": True}'],1,'JSON object keys and strings use double quotes and true is lowercase.'],
['What should API client code do after an unsuccessful status?','',['Assume it worked','Handle or report the failure','Print the secret key','Ignore the response'],1,'Explicit failure handling prevents silent incorrect results.'] ],
bugs:[

{title:'LLM Code Reader',subtitle:'Requests, responses and validation',icon:'🤖',colour:'#bc9eff',lessons:[
['Models receive structured requests','Most LLM APIs take a model name, message content and configuration. Their exact response formats vary by provider and version.','request = {"model": "demo-model", "input": "Say hello"}\nprint(request["input"])','A dictionary is the foundation of many API request payloads.'],
['Do not assume every response is valid','A network call may fail, time out or return unexpected content. Check the response shape before using it.','response = {"output": "Hello"}\nprint(response.get("output", "No reply"))','Using get with a fallback avoids a KeyError if a key is absent.'],
['Structured output still needs checking','A model can generate JSON-shaped results, but your code must still validate types, required fields and allowed values.','data = {"score": "85"}\nscore = int(data["score"])\nprint(score >= 60)','Convert and validate external data before relying on it.'],
['Cost and reliability matter','Tokens influence LLM usage costs. Applications should consider timeouts, retries, rate limits, logging and evaluation of model responses.','usage = {"input_tokens": 300, "output_tokens": 100}\nprint(sum(usage.values()))','This simple payload totals 400 tokens; it is not a monetary cost calculation.'] ],
quiz:[
['What is a key risk when parsing model-generated JSON?','',['All JSON is guaranteed correct','Fields can be missing or have unexpected types','JSON cannot contain lists','JSON is always encrypted'],1,'Validate structure and types; model outputs are not automatically trustworthy.'],
['What does response.get("text", "missing") return if text is absent?','',['KeyError','None','missing','text'],2,'dict.get returns the supplied default when the key is absent.'],
['What does a rate limit control?','',['How many requests can be made over a period','The font of the response','The number of Python variables','The length of file names'],0,'Providers use limits to control request volume or resource usage.'],
['Why log errors in an AI application?','',['To reveal private keys','To diagnose failures and improve reliability','To avoid writing tests','To force a model to be correct'],1,'Useful logs help investigate failures without exposing secrets.'],
['What does a timeout prevent?','',['All wrong answers','Waiting without a bound for an operation','All API costs','Python indentation errors'],1,'Timeouts bound how long your app waits on an operation.'],
['What is a model hallucination?','',['A plausible but unsupported model response','A syntax error in JSON','An API server reboot','An image file type'],0,'Language models can produce convincing but false information.'],
['What should you do before trusting a model’s calculated number?','',['Check with deterministic code or a test','Assume its confidence is proof','Remove validation','Repeat it without review'],0,'Independent computation is more reliable for exact arithmetic.'],
['Which practice helps assess whether prompts work reliably?','',['Evaluation on representative test cases','Only using one example','Removing all logs','Changing model names randomly'],0,'A representative evaluation set exposes weaknesses and regressions.'] ],
bugs:[

['Unvalidated numeric output','data = {"score": "unknown"}\nprint(int(data["score"]))','ValueError','data = {"score": "unknown"}\ntry:\n    print(int(data["score"]))\nexcept (ValueError, TypeError):\n    print("Invalid score")','Model outputs can contain values that are not numeric.'] ],

{title:'AI Agent Engineer',subtitle:'Tools, loops, safety and state',icon:'🛠️',colour:'#6ee0eb',lessons:[
['An agent chooses actions','A tool-using agent can decide to call a function, inspect its result and continue. Your programme must decide which tools and permissions are allowed.','tools = {"add": lambda a, b: a + b}\nprint(tools["add"](2, 5))','The code, not the model alone, executes a permitted tool.'],
['Tool calls need validation','A tool name or argument produced by an LLM is untrusted input. Check that the tool is allowlisted and arguments match expected types.','allowed = {"search", "calculate"}\nrequest = {"tool": "calculate"}\nprint(request["tool"] in allowed)','Never give a model unrestricted access to shells, secrets or destructive actions.'],
['Agents need stopping rules','Without limits, agent loops may repeatedly call tools and waste time or money. Use step counts, budgets and explicit success criteria.','for step in range(3):\n    print("Step", step + 1)','This loop has a fixed maximum of three iterations.'],
['State is what the agent remembers','Agent state may include prior results, tasks completed or remaining budget. Store only what is necessary and protect personal data.','state = {"steps": 0}\nstate["steps"] += 1\nprint(state["steps"])','State updates should be inspectable and testable.'] ],
quiz:[
['Who should enforce tool permissions?','',['The trusted application code','The model’s confidence','The user’s prompt alone','A random tool description'],0,'Application code needs to enforce the permission boundary.'],
['Why limit the number of agent steps?','',['To ensure accurate answers','To avoid endless loops and uncontrolled costs','To hide errors','To disable tests'],1,'Step limits cap repeated operations.'],
['What is an allowlist?','',['An explicit set of permitted actions','A list of every possible error','A set of leaked keys','A list of deleted files'],0,'Allowlisting means only approved operations can be selected.'],
['What should you do before an irreversible action?','',['Use an appropriate approval or permission checkpoint','Always execute without checks','Discard the logs','Disable authentication'],0,'High-impact actions merit tighter permissions or confirmation.'],
['What is agent state?','',['Information retained between steps','Only the programme font','Only the model price','A Python syntax rule'],0,'State captures the context needed for later decisions.'],
['Which is a safe tool-call design?','',['Any model string becomes a shell command','Check tool name and validate arguments before execution','Expose API keys in tool outputs','Ignore failures'],1,'Validate both the selected tool and its arguments.'],
['What is a tool result?','',['Data returned after executing an allowed function','A guarantee of truth from the model','Always a JSON string','The Python interpreter'],0,'The application executes a tool and receives its output.'],
['Why keep a record of agent actions?','',['To debug decisions and inspect what happened','To make every result correct','To eliminate permissions','To bypass rate limits'],0,'Action traces are useful for debugging and evaluation.'] ],

['Unchecked tool request','tools = {"add": lambda a,b: a+b}\nname = "delete"\nprint(tools[name](1, 2))','KeyError','tools = {"add": lambda a,b: a+b}\nname = "delete"\nprint(tools[name](1, 2) if name in tools else "Blocked")','Check the allowlist before executing a named tool.'] ],
labs:[

{title:'Final Python Certification',subtitle:'Bring your Python and AI skills together',icon:'🏆',colour:'#f7c46d',lessons:[
['Read before you edit','When examining unfamiliar code, locate inputs, outputs, dependencies, functions and the main execution path before modifying it.','def classify(score):\n    return "pass" if score >= 50 else "retry"\nprint(classify(74))','Explain expected behaviour before deciding whether the code is correct.'],
['Protect boundaries','Validate external input, keep secrets private and avoid treating model output as executable instructions.','def safe_count(values):\n    if not isinstance(values, list):\n        raise TypeError("Expected list")\n    return len(values)\nprint(safe_count([1, 2]))','A well-designed boundary rejects unexpected types clearly.'],

['Which statement about Python and AI is most accurate?','',['Python alone makes every model safe','AI code needs review, tests and security controls','Every AI response is deterministic','Python eliminates model costs'],1,'Reliable AI systems need engineering processes beyond Python syntax.'],
['What does this print?','def find(items, key):\n    return items.get(key, 0)\nprint(find({"a": 3}, "b"))',['3','b','0','KeyError'],2,'get supplies the default zero for missing b.'],

const PERSONAL_LABS = [["Calculate tutoring income","A 50-minute English lesson earns ¥3,000. Print the revenue from four lessons.","fee = 3000\nlessons = 4\n# Print total revenue","12000","fee = 3000\nlessons = 4\nprint(fee * lessons)","Multiplication combines the price of one lesson with the number of lessons."],["Check a lesson package","A learner has 3 prepaid sessions left. Print 'Book' if any sessions remain.","remaining = 3\n# Use if / else to print Book or Renew","Book","remaining = 3\nif remaining > 0:\n    print('Book')\nelse:\n    print('Renew')","A condition chooses which action happens. The indented block runs only when its test is true."],["Count this week's lessons","Use a list of fictional lesson subjects to print how many lessons are scheduled.","subjects = ['English', 'Cantonese', 'Japanese', 'IELTS']\n# Print how many","4","subjects = ['English', 'Cantonese', 'Japanese', 'IELTS']\nprint(len(subjects))","len counts the items in a list. It does not count letters."],["Build a polite email greeting","Define greeting(name) and print 'Hello Mia,' when called with Mia.","# Define greeting(name)\n# Print greeting('Mia')","Hello Mia,","def greeting(name):\n    return 'Hello ' + name + ','\nprint(greeting('Mia'))","A function turns the same template into reusable code. return passes the finished greeting to print."],["Debug a homework score","An AI returned a writing score as a string. Convert it to an integer before adding 1.","score = '6'\n# Fix this so it prints 7","7","score = '6'\nprint(int(score) + 1)","'6' is text. int changes it into a number before arithmetic."],["Read a fictional Gmail draft","A draft is represented as JSON. Decode it and print its subject.","import json\nraw = '{\"subject\":\"Homework feedback\",\"ready\":false}'\n# Print the subject","Homework feedback","import json\nraw = '{\"subject\":\"Homework feedback\",\"ready\":false}'\nmessage = json.loads(raw)\nprint(message['subject'])","json.loads converts JSON text into a Python dictionary. The subject field is accessed by its key."],["Average IELTS practice results","Print the mean of three fictional IELTS writing band scores: 5, 6 and 7.","bands = [5, 6, 7]\n# Print the mean as a float","6.0","bands = [5, 6, 7]\nprint(sum(bands) / len(bands))","sum adds the scores; len counts the scores. Dividing gives the average."],["Review an AI proofreading response","Use get so a missing corrected_text field prints 'Needs review' instead of crashing.","ai_response = {'status': 'incomplete'}\n# Print corrected_text or Needs review","Needs review","ai_response = {'status': 'incomplete'}\nprint(ai_response.get('corrected_text', 'Needs review'))","AI responses can omit fields. get supplies a safe default rather than causing KeyError."],["Protect an email-sending agent","A model requested send_email. Allow draft_email only, and print 'Blocked' when the request is not allowed.","allowed = {'draft_email'}\nrequested_tool = 'send_email'\n# Print Blocked or Allowed","Blocked","allowed = {'draft_email'}\nrequested_tool = 'send_email'\nprint('Allowed' if requested_tool in allowed else 'Blocked')","An allowlist is a set of permitted tools. Your code checks permission rather than trusting the model."],["Check for timetable clashes","Two fictional lessons start at 10:00. Print 'Clash' if their times are equal.","lesson_a = '10:00'\nlesson_b = '10:00'\n# Print Clash or Clear","Clash","lesson_a = '10:00'\nlesson_b = '10:00'\nprint('Clash' if lesson_a == lesson_b else 'Clear')","== compares values. This simple check detects matching starts; real scheduling must also compare lesson durations."]];
const ORIGINAL_SOLUTIONS = [["points = 7\npoints += 5\nprint(points)","language = 'Python'\nprint('I study ' + language)"],["mark = 72\nprint('Pass' if mark >= 50 else 'Retry')","age = 21\nticket = True\nif age >= 18 and ticket:\n    print('Welcome')"],["values = [4, 6, 8]\nprint(sum(values))","profile = {'name':'Andy','language':'Cantonese'}\nprint(profile['language'])"],["def add(a, b):\n    return a + b\nprint(add(5, 7))","def greeting(name):\n    return 'Hi ' + name\nprint(greeting('Sam'))"],["def square(x):\n    return x*x\nassert square(4) == 16\nprint('Passed')","try:\n    int('oops')\nexcept ValueError:\n    print('Invalid')"],["import json\nraw = '{\"name\": \"Mia\"}'\ndata = json.loads(raw)\nprint(data['name'])","import json\ndata = {'ok': True}\nprint(json.dumps(data, separators=(',', ':')))"],["scores = [4, 8, 12]\nprint(sum(scores) / len(scores))","a = [1, 2, 3]\nb = [4, 5, 6]\nprint([x+y for x,y in zip(a,b)])"],["data = {'other': 'Hi'}\nprint(data.get('reply','No response'))","payload = {'score': '75'}\nprint(int(payload['score']) >= 50)"],["allowed = {'search','calculate'}\nrequest = 'delete'\nprint('Allowed' if request in allowed else 'Blocked')","for step in range(1,4):\n    print('Step',step)"],["def classify(score):\n    return 'Pass' if score >= 50 else 'Retry'\nprint(classify(65))","tools = {'add': lambda a,b:a+b}\nallowed = {'add'}\nif 'add' in allowed:\n    print(tools['add'](3,4))"]];
WORLDS.forEach((world,i)=>{world.labs.forEach((lab,j)=>{lab[4]=ORIGINAL_SOLUTIONS[i][j];lab[5]='Read each line from top to bottom. Notice the variables, Python keywords and the value sent to print(). Compare it with the expected output.';});world.labs.push(PERSONAL_LABS[i]);});

(()=>{'use strict';
const KEY='python-quest-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{};}catch{state={}};state.answers??={};state.lessons??={};state.bugs??={};state.labs??={};state.xp??=0;state.attempts??={};let screen={world:-1,mode:'dashboard',index:0};let runner=null,runnerReady=false,runtimeLoading=false,runtimeTimer=null;
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const qid=(w,i)=>`q-${w}-${i}`;const bid=(w,i)=>`b-${w}-${i}`;const lid=(w,i)=>`l-${w}-${i}`;const done=(w)=>{let p=0,world=WORLDS[w];world.lessons.forEach((_,i)=>p+=!!state.lessons[lid(w,i)]);world.quiz.forEach((_,i)=>p+=state.answers[qid(w,i)]===iCorrect(world.quiz[i]));world.bugs.forEach((_,i)=>p+=!!state.bugs[bid(w,i)]);world.labs.forEach((_,i)=>p+=!!state.labs[lid(w,i)]);return Math.round(p/(world.lessons.length+world.quiz.length+world.bugs.length+world.labs.length)*100)};const iCorrect=q=>q[3];const score=()=>WORLDS.reduce((a,_,i)=>a+done(i),0)/WORLDS.length;function award(id,amount){if(!state.attempts['reward-'+id]){state.xp+=amount;state.attempts['reward-'+id]=true}}function nav(){document.getElementById('worldnav').innerHTML=WORLDS.map((w,i)=>`<button class="sideitem ${screen.world===i?'active':''}" data-world="${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><span>${esc(w.title)}</span><span class="tick">${done(i)===100?'✓':''}</span></button>`).join('')};function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2300)};
function home(){screen={world:-1,mode:'dashboard',index:0};const totalLessons=Object.keys(state.lessons).length, solved=Object.values(state.answers).length, bugs=Object.keys(state.bugs).length,labs=Object.keys(state.labs).length;document.getElementById('main').innerHTML=`<div class="hero"><div><span class="tag">LEARN • READ • DEBUG • BUILD</span><h1>Your journey from zero<br>to AI engineer.</h1><p>Understand the Python behind AI, LLMs and tool-using agents.</p></div><div class="heroaccent">🚀</div></div><div class="stats"><div class="stat"><strong>${Math.round(score())}%</strong><span class="small">Total mastery</span></div><div class="stat"><strong>${state.xp}</strong><span class="small">XP earned</span></div><div class="stat"><strong>${solved}/80</strong><span class="small">Quiz attempts</span></div><div class="stat"><strong>${labs}/30</strong><span class="small">Code labs passed</span></div></div><div class="card" style="margin-top:18px"><div class="meta"><div><h2 style="margin:0">Your learning path</h2><p class="small">10 worlds • 40 lessons • 80 questions • 20 bug hunts • 30 coding labs</p></div><button class="btn primary" data-world="${Math.max(0,WORLDS.findIndex((_,i)=>done(i)<100))}">Continue learning →</button></div><div class="progress" style="margin-top:14px"><div class="fill" style="width:${score()}%"></div></div></div><h2 class="sectionTitle">Choose a world</h2><div class="worldgrid">${WORLDS.map((w,i)=>`<button class="worldcard" data-world="${i}" style="border-top:3px solid ${w.colour}"><div class="worldicon">${w.icon}</div><h3>${String(i+1).padStart(2,'0')}. ${esc(w.title)}</h3><p>${esc(w.subtitle)}</p><div class="meta"><span class="small">${done(i)}% mastery</span><span class="badge">${done(i)===100?'COMPLETE':'PLAY →'}</span></div><div class="progress" style="margin-top:9px"><div class="fill" style="width:${done(i)}%;background:${w.colour}"></div></div></button>`).join('')}</div><div class="card" style="margin-top:20px"><h3>How to play</h3><p class="small">1. Read each short lesson. 2. Answer code-reading questions. 3. Fix deliberately broken code. 4. Run and repair genuine Python in the Code Lab. Your progress saves in this browser; a new device will not automatically inherit it.</p><p class="small">The Code Lab downloads a free Python interpreter into your browser on first use. It needs an internet connection for that download. No account or paid API is required.</p></div>`;nav()}
function goWorld(w,mode='lessons'){screen={world:w,mode,index:0};render()}
function render(){if(screen.world<0){home();return}let w=screen.world,world=WORLDS[w];document.getElementById('main').innerHTML=`<div class="hero"><div><span class="tag">WORLD ${String(w+1).padStart(2,'0')} / 10</span><h1>${world.icon} ${esc(world.title)}</h1><p>${esc(world.subtitle)}</p></div><div style="text-align:right"><strong style="font-size:1.8rem">${done(w)}%</strong><div class="small">mastered</div></div></div><div class="progress"><div class="fill" style="width:${done(w)}%;background:${world.colour}"></div></div><div class="mode-tabs">${[['lessons','📚 Lessons (4)'],['quiz','🧠 Quiz (8)'],['bugs','🐛 Debug (2)'],['labs','⌨️ Code Lab (3)']].map(([mode,label])=>`<button class="${screen.mode===mode?'active':''}" data-mode="${mode}">${label}</button>`).join('')}</div><div id="panel"></div><div class="btnbar"><button class="btn" data-world="${Math.max(w-1,0)}" ${w===0?'disabled':''}>← Previous world</button><button class="btn" data-home="1">All worlds</button><button class="btn" data-world="${Math.min(w+1,WORLDS.length-1)}" ${w===9?'disabled':''}>Next world →</button></div>`;nav();renderMode()}
function renderMode(){const w=screen.world,world=WORLDS[w],panel=document.getElementById('panel');if(screen.mode==='lessons'){panel.innerHTML=`<p class="intro">Read each short explanation and mark it understood. Revisit lessons whenever you like.</p><div class="lesson-stack">${world.lessons.map((lesson,i)=>`<article class="card"><div class="lesson-head"><span class="badge">LESSON ${i+1}</span><span class="small">${state.lessons[lid(w,i)]?'✓ Understood':'Not yet completed'}</span></div><h2>${esc(lesson[0])}</h2><p class="intro">${esc(lesson[1])}</p><pre class="code">${esc(lesson[2])}</pre><div class="note">💡 ${esc(lesson[3])}</div><div class="btnbar"><button class="btn ${state.lessons[lid(w,i)]?'':'primary'}" data-lesson="${i}">${state.lessons[lid(w,i)]?'✓ Completed':'Mark understood +10 XP'}</button><button class="btn" data-loadexample="${i}">Practise this code ↗</button></div></article>`).join('')}</div>`}
if(screen.mode==='quiz'){panel.innerHTML=`<p class="intro">Read the code carefully before choosing. Explanations appear immediately; missed questions can be practised in Review.</p>${world.quiz.map((q,i)=>{const id=qid(w,i),choice=state.answers[id],right=q[3];return `<article class="qbox"><div class="meta"><span class="badge">QUESTION ${i+1}/8</span><span class="small">${choice===undefined?'Not answered':choice===right?'✓ Correct':'↻ Review needed'}</span></div><h3>${esc(q[0])}</h3>${q[1]?`<pre class="code">${esc(q[1])}</pre>`:''}<div class="choices">${q[2].map((o,j)=>`<button class="choice ${choice===j?(j===right?'right':'wrong'):choice!==undefined&&j===right?'right':''}" data-answer="${i}:${j}" ${choice!==undefined?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><button class="btn" data-showquiz="${i}" style="margin-top:9px">💡 Show answer & explanation</button><div class="note" style="display:none" id="quiz-solution-${i}"></div>${choice!==undefined?`<div class="feedback ${choice===right?'good':'bad'}"><strong>${choice===right?'✓ Correct!':'✗ Not quite.'}</strong> ${esc(q[4])}</div>`:''}</article>`}).join('')}`}
if(screen.mode==='bugs'){panel.innerHTML=`<p class="intro">Inspect the broken code and the reported fault. Reveal the smallest working repair, then explain it to yourself before marking it solved.</p>${world.bugs.map((b,i)=>`<article class="card"><div class="meta"><span class="badge">CASE ${i+1}/2</span><span class="small">${state.bugs[bid(w,i)]?'✓ Solved':'Open case'}</span></div><h2>🐛 ${esc(b[0])}</h2><pre class="code">${esc(b[1])}</pre><p><strong>Symptom:</strong> ${esc(b[2])}</p><div class="btnbar"><button class="btn" data-reveal="${i}">${screen.revealBug===i?'Hide solution':'Show repair & explanation'}</button><button class="btn primary" data-bugdone="${i}" ${state.bugs[bid(w,i)]?'disabled':''}>${state.bugs[bid(w,i)]?'✓ Solved':'I understand the repair +20 XP'}</button></div>${screen.revealBug===i?`<div style="margin-top:14px"><h3>Working repair</h3><pre class="code">${esc(b[3])}</pre><div class="note">${esc(b[4])}</div><div class="btnbar"><button class="btn" data-copyfix="${i}">Load repaired code in Lab ↗</button></div></div>`:''}</article>`).join('')}`}
if(screen.mode==='labs'){panel.innerHTML=`<div class="warning">🔐 Real Python runs in a temporary browser worker using Pyodide. The first run needs internet access. This is a learning environment, not a security boundary for untrusted code; never enter passwords or private API keys. Runs are stopped after 10 seconds.</div><p class="intro">Write or edit the Python code, then press Run & Check. Output must match the expected output exactly (ignoring surrounding whitespace). The checker tests visible output, so passing does not prove the implementation is otherwise correct.</p>${world.labs.map((lab,i)=>`<article class="card"><div class="meta"><span class="badge">LAB ${i+1}/${world.labs.length}</span><span class="small">${state.labs[lid(w,i)]?'✓ Passed':'Ready to code'}</span></div><h2>${esc(lab[0])}</h2><p class="intro">${esc(lab[1])}</p><div class="split"><div><p class="small">PYTHON EDITOR</p><textarea class="editor" id="editor-${i}" spellcheck="false" aria-label="Python code for lab ${i+1}">${esc(state['code-'+lid(w,i)]??lab[2])}</textarea></div><div><p class="small">EXPECTED OUTPUT</p><pre class="output">${esc(lab[3])}</pre><p class="small">YOUR OUTPUT</p><pre class="output" id="output-${i}">Press Run & Check to begin.</pre></div></div><div class="btnbar"><button class="btn primary" data-run="${i}">▶ Run & Check</button><button class="btn" data-resetlab="${i}">Reset editor</button><button class="btn" data-showanswer="${i}">💡 Show answer & explanation</button><span class="small" id="runtime-status-${i}"></span></div><div id="solution-${i}" class="note" style="display:none;white-space:pre-wrap;margin-top:12px"></div></article>`).join('')}`}
}
function ensureWorker(){
if(runnerReady)return Promise.resolve();
if(runtimeLoading)return runtimeLoading;
const workerSource=`
let py=null;
self.onmessage=async e=>{
const m=e.data;
if(m.kind==='init'){
try{
try{importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js')}
catch(first){importScripts('https://unpkg.com/pyodide@0.27.7/pyodide.js')}
try{py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'})}catch(networkError){py=await loadPyodide({indexURL:'https://unpkg.com/pyodide@0.27.7/'})}
self.postMessage({kind:'ready'});
}catch(err){self.postMessage({kind:'error',error:String(err)})}
}else if(m.kind==='run'){
let out=[];
try{
py.setStdout({batched:s=>out.push(s)});
py.setStderr({batched:s=>out.push(s)});
await py.runPythonAsync(m.code);
self.postMessage({kind:'result',id:m.id,output:out.join('\\n')});
}catch(err){self.postMessage({kind:'result',id:m.id,output:out.join('\\n')+(out.length?'\\n':'')+String(err),error:true})}
}
};`;
runtimeLoading=new Promise((resolve,reject)=>{
let settled=false;let timer;
try{
runner=new Worker(URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'})));
timer=setTimeout(()=>fail('Python took too long to download. Check your internet connection or try Chrome or Firefox.'),90000);
function fail(message){if(settled)return;settled=true;clearTimeout(timer);runner?.terminate();runner=null;runnerReady=false;runtimeLoading=false;reject(new Error(message))}
runner.onmessage=e=>{if(e.data.kind==='ready'){if(settled)return;settled=true;clearTimeout(timer);runnerReady=true;runtimeLoading=false;resolve()}else if(e.data.kind==='error')fail('Interpreter failed to load: '+e.data.error+'. Check that your network permits cdn.jsdelivr.net and unpkg.com.')};
runner.onerror=()=>fail('Browser blocked the Python worker. Open the hosted GitHub Pages version instead of a local file, and check browser extensions.');
runner.postMessage({kind:'init'});
}catch(err){if(timer)clearTimeout(timer);runtimeLoading=false;reject(new Error('Unable to create Python runner: '+String(err)))}
});
return runtimeLoading;
}
async function runCode(code,expected,output,status,onPass){status.textContent='Loading or preparing Python…';try{await ensureWorker()}catch(e){output.textContent=e.message+'\n\nThe answer button still works even without the interpreter.';status.textContent='Unable to load Python';return}status.textContent='Running…';let id=Date.now()+'-'+Math.random();let finished=false;return await new Promise(resolve=>{const old=runner.onmessage;const timeout=setTimeout(()=>{if(finished)return;finished=true;runner.terminate();runner=null;runnerReady=false;output.textContent='Execution timed out after 10 seconds. Check for an infinite loop.';status.textContent='Time limit exceeded';resolve()},10000);runner.onmessage=e=>{if(e.data.kind!=='result'||e.data.id!==id)return;finished=true;clearTimeout(timeout);runner.onmessage=old;output.textContent=e.data.output||'(No printed output)';const success=!e.data.error&&e.data.output.trim()===expected.trim();status.textContent=success?'✓ Output matches':'Output does not match yet';if(success)onPass();resolve()};runner.postMessage({kind:'run',code,id})})}
function review(){screen={world:-1,mode:'review',index:0};let misses=[];WORLDS.forEach((world,w)=>world.quiz.forEach((q,i)=>{if(state.answers[qid(w,i)]!==undefined&&state.answers[qid(w,i)]!==q[3])misses.push({w,i,q})}));document.getElementById('main').innerHTML=`<div class="hero"><div><span class="tag">ADAPTIVE REVISION</span><h1>🎯 Review your mistakes</h1><p>Target the questions you missed, one concept at a time.</p></div></div>${misses.length?`<div class="card"><p class="small">${misses.length} question(s) to revisit. Select a world to practise them again.</p>${misses.map(x=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><strong>${esc(x.q[0])}</strong><div class="small">World ${x.w+1}: ${esc(WORLDS[x.w].title)}</div><div class="btnbar"><button class="btn" data-retry="${x.w}:${x.i}">Retry this question</button></div></div>`).join('')}</div>`:`<div class="card empty">🎉 No missed quiz questions recorded. Complete more quizzes to build your review list.</div>`}<button class="btn" data-home="1">← Dashboard</button>`;nav()}
function loadIntoLab(code){screen.mode='labs';render();const editor=document.getElementById('editor-0');if(editor){editor.value=code;editor.focus();toast('Code loaded into the first lab editor.')}}
document.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;const d=button.dataset;if(d.home){home();return}if(d.world!==undefined){goWorld(Number(d.world));document.getElementById('sidebar').classList.remove('show');return}if(d.mode){screen.mode=d.mode;screen.revealBug=-1;render();return}if(d.review){review();return}if(d.reset){if(confirm('Delete all Python Quest progress on this browser?')){localStorage.removeItem(KEY);location.reload()}return}if(d.lesson!==undefined){let key=lid(screen.world,Number(d.lesson));if(!state.lessons[key]){state.lessons[key]=true;award(key,10);save();toast('Lesson complete! +10 XP')}render();return}if(d.loadexample!==undefined){const code=WORLDS[screen.world].lessons[Number(d.loadexample)][2];loadIntoLab(code);return}if(d.showquiz!==undefined){const i=Number(d.showquiz),q=WORLDS[screen.world].quiz[i],box=document.getElementById("quiz-solution-"+i);box.style.display=box.style.display==="none"?"block":"none";box.textContent="Answer: "+q[2][q[3]]+". "+q[4];return}if(d.answer){let [i,j]=d.answer.split(':').map(Number),key=qid(screen.world,i),q=WORLDS[screen.world].quiz[i];if(state.answers[key]!==undefined)return;state.answers[key]=j;if(j===q[3])award(key,15);save();renderMode();return}if(d.reveal!==undefined){screen.revealBug=screen.revealBug===Number(d.reveal)?-1:Number(d.reveal);renderMode();return}if(d.bugdone!==undefined){const key=bid(screen.world,Number(d.bugdone));if(screen.revealBug!==Number(d.bugdone)){toast('Reveal and study the repair before marking it complete.');return}if(!state.bugs[key]){state.bugs[key]=true;award(key,20);save();toast('Bug explained! +20 XP')}render();return}if(d.copyfix!==undefined){loadIntoLab(WORLDS[screen.world].bugs[Number(d.copyfix)][3]);return}if(d.showanswer!==undefined){const i=Number(d.showanswer);const lab=WORLDS[screen.world].labs[i];const box=document.getElementById("solution-"+i);if(box){box.style.display=box.style.display==="none"?"block":"none";box.textContent="WORKED ANSWER:\n"+lab[4]+"\n\nEXPLANATION:\n"+lab[5]+"\n\nTip: Compare your own code with this solution line by line.";};return}if(d.resetlab!==undefined){let i=Number(d.resetlab);let key='code-'+lid(screen.world,i);delete state[key];save();renderMode();return}if(d.run!==undefined){let i=Number(d.run),key=lid(screen.world,i),lab=WORLDS[screen.world].labs[i],editor=document.getElementById('editor-'+i),output=document.getElementById('output-'+i),status=document.getElementById('runtime-status-'+i);state['code-'+key]=editor.value;save();button.disabled=true;await runCode(editor.value,lab[3],output,status,()=>{if(!state.labs[key]){state.labs[key]=true;award(key,30);save();toast('Lab passed! +30 XP')}});button.disabled=false;return}if(d.retry){let [w,i]=d.retry.split(':').map(Number);delete state.answers[qid(w,i)];save();goWorld(w,'quiz');setTimeout(()=>{const target=document.querySelectorAll('.qbox')[i];target?.scrollIntoView({behavior:'smooth',block:'start'})},30);return}});
document.addEventListener('input',e=>{if(e.target.matches('textarea.editor')){let i=Number(e.target.id.split('-')[1]);state['code-'+lid(screen.world,i)]=e.target.value;save()}});document.getElementById('menubtn').onclick=()=>document.getElementById('sidebar').classList.toggle('show');home();
})();
</script></body></html>
